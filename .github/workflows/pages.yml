name: Check and publish course site

on:
  push:
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/coronation.js
          node --check docs/shapley/game.mjs
          node --check docs/shapley/story.js
          node --check docs/shapley/weight-view.js
          node --check docs/shapley/formula-view.js
          node --check docs/shap/calculation.mjs
          node --check docs/shap/story.js
          node --check docs/shap/waterfall.js
          node --check docs/shap/formula.js
          node --check docs/shap/bread-peace.js
          node --check docs/shared/boosting-math.js
          node --check docs/boosting/story.js
          node --check docs/boosting/prediction-view.js
          node --check docs/boosting/restricted-view.js
          node --check docs/boosting/worked-example.js
          node --check docs/boosting/worked-view.js
          node --check docs/boosting/loss-example.js
          node --check docs/boosting/loss-view.js
          node --check docs/boosting/geometry.js
          node --check docs/trees/model.js
          node --check docs/trees/delivery.js
          node --check docs/trees/delivery-view.js
          node --check docs/trees/growth.js
          node --check docs/trees/growth-view.js
          node --check docs/trees/title-picture.js
          node --check docs/trees/title-motion.js
          node --check docs/trees/story.js
          node --check docs/imbalanced-data/model.js
          node --check docs/imbalanced-data/app.js
          node --check docs/imbalanced-data/chapter-scenes.js
          node --check docs/imbalanced-data/scrolly.js
          node --check docs/double-ml/model.mjs
          node --check docs/double-ml/story.js
      - name: Check interactive lesson calculations
        run: node --test tests/*.test.mjs

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
