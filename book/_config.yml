# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: POLS 4728
author: Alexander Clark, Columbia University
logo: assets/logos/ML_logo_simple.svg

# Execute notebooks only when needed during local development.
execute:
  execute_notebooks: auto
  exclude_patterns:
    - chapters/predictive.ipynb
    - reference/hugging_face.ipynb
    - reference/prelims_and_digressions.ipynb

# Exclude generated and legacy artifacts from source discovery
exclude_patterns:
  - "**/.virtual_documents/**"
  - "**/.ipynb_checkpoints/**"
  - "**/__pycache__/**"
  - "**/.DS_Store"
  - "**/.claude/**"
  - "_build/**"
  - "chapters/interpretability.ipynb"
  - "chapters/bias_variance.md"
  - "chapters/dimensionality_reduction.ipynb"
  - "chapters/linear_reg.ipynb"
  - "chapters/linreg.md"
  - "chapters/linear_models.md"
  - "chapters/tree_methods.md"
  - "chapters/model_validation.md"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - ../references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/alexanderthclark/pols4728
  path_to_book: book
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  favicon: ./_static/favicon_square_very_bold.ico
  extra_head: |
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  extra_navbar: |
    <style>
    .navbar-brand img {
      max-height: 80px !important;
      height: 80px !important;
    }
    .sidebar-primary .navbar-brand img {
      max-height: 80px !important;
      height: 80px !important;
    }
    </style>

launch_buttons:
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"
  thebe: true
  notebook_interface: "jupyterlab"

# MyST parser configuration
parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath

sphinx:
  extra_extensions:
    - sphinx_exercise
    - sphinx_togglebutton
    - sphinxcontrib.bibtex
  config:
    numfig: true
    numfig_secnum_depth: 2
    bibtex_footbibliography_header: ""
    bibtex_reference_style: author_year
    bibtex_default_style: plain
    suppress_warnings: ["bibtex.duplicate_label"]
